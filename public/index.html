<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Agent Test UI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 12px;
      grid-template-columns: 2fr 1fr;
    }

    @media (max-width: 720px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #fff;
      border: 1px solid #e2e4e8;
      border-radius: 12px;
      padding: 12px;
    }

    h2 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    #chat {
      height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #2f6fed;
      color: #fff;
    }

    .bot {
      align-self: flex-start;
      background: #eef0f3;
    }

    .tools {
      font-size: 12px;
      color: #666;
      align-self: flex-start;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    td,
    th {
      text-align: left;
      padding: 6px 4px;
      border-bottom: 1px solid #eee;
    }

    .total {
      margin-top: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h2>Ask</h2>
      <div id="chat"></div>
      <form id="form">
        <input id="input" placeholder="e.g. show bluetooth speaker details" autocomplete="off" required>
        <button id="send">Send</button>
      </form>
    </div>
    <div class="card">
      <h2>Cart</h2>
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody id="cart"></tbody>
      </table>
      <div class="total" id="total"></div>
    </div>
  </div>
  <script>
    const API = ""; // later: "https://your-server.com"
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMsg(text, cls) {
      const d = document.createElement("div");
      d.className = cls;
      if (cls !== "tools") d.classList.add("msg");
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadCart() {
      const r = await fetch(API + "/cart");
      const data = await r.json();
      const body = document.getElementById("cart");
      body.textContent = "";
      for (const it of data.items || []) {
        const tr = document.createElement("tr");
        for (const v of [it.product, it.qty, it.price]) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }
      document.getElementById("total").textContent = "Total: " + (data.total || 0);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      addMsg(message, "user");
      send.disabled = true;
      try {
        const r = await fetch(API + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Request failed");
        if (data.toolsUsed?.length) addMsg("tools: " + data.toolsUsed.map(t => t.name).join(" → "), "tools");
        addMsg(data.answer, "bot");
        history.push({ role: "user", content: message }, { role: "assistant", content: data.answer });
        loadCart();
      } catch (err) {
        addMsg("Error: " + err.message, "bot");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    loadCart();
  </script>
</body>

</html>
